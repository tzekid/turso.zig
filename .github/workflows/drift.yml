name: Development target maintenance

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
    inputs:
      mutate:
        description: Create or update GitHub issues, branches, and draft pull requests
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: development-target-maintenance
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  resolve:
    name: Resolve moving channels
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      zig_changed: ${{ steps.compare.outputs.zig_changed }}
      turso_changed: ${{ steps.compare.outputs.turso_changed }}
      zig_release: ${{ steps.compare.outputs.zig_release }}
      turso_release: ${{ steps.compare.outputs.turso_release }}
      zig_version: ${{ steps.compare.outputs.zig_version }}
      turso_commit: ${{ steps.compare.outputs.turso_commit }}
      zig_stable: ${{ steps.compare.outputs.zig_stable }}
      turso_stable: ${{ steps.compare.outputs.turso_stable }}
    steps:
      - name: Check out promoted targets
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read promoted development targets
        id: targets
        run: tools/export-development-targets.sh

      - name: Install promoted Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ steps.targets.outputs.zig_version }}
          use-cache: false

      - name: Resolve candidates
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: tools/resolve-development-targets.sh > candidate.json

      - name: Compare candidates
        id: compare
        run: |
          promoted=tools/development-targets.json
          candidate=candidate.json
          {
            echo "zig_changed=$(jq -s '.[0].zig != .[1].zig' "$promoted" "$candidate")"
            echo "turso_changed=$(jq -s '.[0].turso != .[1].turso' "$promoted" "$candidate")"
            echo "zig_release=$(jq -s '.[0].release_monitor.zig_last_notified != .[1].discovered_stable.zig' "$promoted" "$candidate")"
            echo "turso_release=$(jq -s '.[0].release_monitor.turso_last_notified != .[1].discovered_stable.turso' "$promoted" "$candidate")"
            echo "zig_version=$(jq -r .zig.version "$candidate")"
            echo "turso_commit=$(jq -r .turso.commit "$candidate")"
            echo "zig_stable=$(jq -r .discovered_stable.zig "$candidate")"
            echo "turso_stable=$(jq -r .discovered_stable.turso "$candidate")"
          } >> "$GITHUB_OUTPUT"

      - name: Upload immutable candidate record
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: development-candidate
          path: candidate.json
          retention-days: 30

  zig-candidate:
    name: Zig master candidate
    needs: resolve
    if: needs.resolve.outputs.zig_changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      classification: ${{ steps.classify.outputs.classification }}
    steps:
      - name: Check out project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: development-candidate

      - name: Read promoted development targets
        id: targets
        run: tools/export-development-targets.sh

      - name: Install candidate Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ needs.resolve.outputs.zig_version }}
          use-cache: false

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"

      - name: Check formatting
        id: format
        continue-on-error: true
        run: zig fmt --check build.zig src tests examples bench tools/soak.zig

      - name: Run candidate matrix
        id: verify
        continue-on-error: true
        run: |
          zig version
          zig build test-pure --summary all
          zig build test-ownership-invariants -Doptimize=ReleaseFast --summary all
          zig build test -j2 --summary all
          zig build examples -j2 --summary all
          zig build docs --summary all

      - name: Classify
        id: classify
        if: always()
        env:
          FORMAT_OUTCOME: ${{ steps.format.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          mkdir -p evidence
          jq -n \
            --arg format "$FORMAT_OUTCOME" \
            --arg verify "$VERIFY_OUTCOME" \
            '{
              infrastructure: "passed",
              stable_release_detected: false,
              format: (if $format == "success" then "unchanged" else "changed" end),
              compile: (if $verify == "success" then "passed" else "failed" end),
              tests: (if $verify == "success" then "passed" else "failed" end),
              abi: "unchanged",
              behavior_audit: "unchanged",
              features: "unchanged",
              native_dependencies: "unchanged",
              licenses: "unchanged"
            }' > evidence/classification-evidence.json
          tools/classify-development-target.sh \
            zig tools/development-targets.json candidate.json \
            evidence/classification-evidence.json > evidence/classification.json
          echo "classification=$(jq -r .classification evidence/classification.json)" >> "$GITHUB_OUTPUT"
          jq . evidence/classification.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Zig evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zig-candidate-evidence
          path: evidence/
          retention-days: 30

  turso-candidate:
    name: Turso main candidate
    needs: resolve
    if: needs.resolve.outputs.turso_changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      classification: ${{ steps.classify.outputs.classification }}
    steps:
      - name: Check out project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: development-candidate

      - name: Check out exact Turso candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tursodatabase/turso
          ref: ${{ needs.resolve.outputs.turso_commit }}
          path: candidate-turso
          persist-credentials: false

      - name: Read promoted development targets
        id: targets
        run: tools/export-development-targets.sh

      - name: Install promoted Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ steps.targets.outputs.zig_version }}
          use-cache: false

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"

      - name: Audit and test exact candidate
        id: verify
        continue-on-error: true
        run: tools/check-upstream-drift.sh "$RUNNER_TEMP/turso-evidence" "$GITHUB_WORKSPACE/candidate-turso"

      - name: Ensure evidence exists
        if: always()
        env:
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          mkdir -p "$RUNNER_TEMP/turso-evidence"
          if test ! -f "$RUNNER_TEMP/turso-evidence/classification-evidence.json"; then
            jq -n --arg outcome "$VERIFY_OUTCOME" \
              '{
                infrastructure: (if $outcome == "success" then "passed" else "failed" end),
                stable_release_detected: false
              }' > "$RUNNER_TEMP/turso-evidence/classification-evidence.json"
          fi

      - name: Classify
        id: classify
        if: always()
        run: |
          tools/classify-development-target.sh \
            turso tools/development-targets.json candidate.json \
            "$RUNNER_TEMP/turso-evidence/classification-evidence.json" \
            > "$RUNNER_TEMP/turso-evidence/classification.json"
          echo "classification=$(jq -r .classification "$RUNNER_TEMP/turso-evidence/classification.json")" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/turso-evidence/summary.txt" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          jq . "$RUNNER_TEMP/turso-evidence/classification.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Turso evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: turso-candidate-evidence
          path: ${{ runner.temp }}/turso-evidence/
          retention-days: 30

  resolver-failure:
    name: Report resolver infrastructure failure
    needs: resolve
    if: >-
      always() && needs.resolve.result == 'failure' &&
      (github.event_name == 'schedule' || inputs.mutate == true)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open one deduplicated infrastructure issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          marker="development-target:resolver:infrastructure"
          gh label create upstream-maintenance --repo "$REPOSITORY" --color B60205 --force
          number=$(
            gh issue list --repo "$REPOSITORY" --state open --limit 100 \
              --label upstream-maintenance --json number,body \
              --jq ".[] | select(.body | contains(\"$marker\")) | .number" |
              head -1
          )
          if test -n "$number"; then
            echo "Resolver issue #$number is already open; duplicate notification suppressed."
            exit 0
          fi
          gh issue create --repo "$REPOSITORY" \
            --title "Development target resolver infrastructure failure" \
            --label upstream-maintenance \
            --body "<!-- $marker -->

          The retried candidate resolver failed before producing trustworthy evidence.

          Workflow: $RUN_URL"

  release-events:
    name: Report new stable ${{ matrix.upstream }} release
    needs: resolve
    if: >-
      needs.resolve.result == 'success' &&
      (github.event_name == 'schedule' || inputs.mutate == true) &&
      (needs.resolve.outputs.zig_release == 'true' || needs.resolve.outputs.turso_release == 'true')
    strategy:
      fail-fast: false
      matrix:
        include:
          - upstream: zig
            detected: ${{ needs.resolve.outputs.zig_release }}
            revision: ${{ needs.resolve.outputs.zig_stable }}
          - upstream: turso
            detected: ${{ needs.resolve.outputs.turso_release }}
            revision: ${{ needs.resolve.outputs.turso_stable }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open one deduplicated release issue
        if: matrix.detected == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          UPSTREAM: ${{ matrix.upstream }}
          REVISION: ${{ matrix.revision }}
        run: |
          marker="development-target:$UPSTREAM:$REVISION:release-event"
          gh label create upstream-maintenance --repo "$REPOSITORY" --color B60205 --force
          gh label create "$UPSTREAM" --repo "$REPOSITORY" --color 1D76DB --force
          gh label create release-candidate --repo "$REPOSITORY" --color 0E8A16 --force
          gh label create needs-human --repo "$REPOSITORY" --color B60205 --force
          number=$(
            gh issue list --repo "$REPOSITORY" --state all --limit 100 \
              --label upstream-maintenance --json number,body,state \
              --jq ".[] | select(.body | contains(\"$marker\")) | .number" |
              head -1
          )
          if test -n "$number"; then
            echo "Issue #$number already records this release; duplicate notification suppressed."
            exit 0
          fi
          gh issue create --repo "$REPOSITORY" \
            --title "$UPSTREAM stable release available: $REVISION" \
            --label "upstream-maintenance,$UPSTREAM,release-candidate,needs-human" \
            --body "<!-- $marker -->

          A new stable $UPSTREAM release, **$REVISION**, is available.

          This is a notification only. It does not modify \`master\`, \`v0.1.1-stable\`, a release tag, or the package version.

          Evidence: $RUN_URL"

  act:
    name: Act on ${{ matrix.upstream }} candidate
    needs: [resolve, zig-candidate, turso-candidate]
    if: always() && needs.resolve.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - upstream: zig
            classification: ${{ needs.zig-candidate.outputs.classification }}
            revision: ${{ needs.resolve.outputs.zig_version }}
          - upstream: turso
            classification: ${{ needs.turso-candidate.outputs.classification }}
            revision: ${{ needs.resolve.outputs.turso_commit }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    env:
      MUTATE: ${{ github.event_name == 'schedule' || inputs.mutate == true }}
    steps:
      - name: Summarize dry run or skipped candidate
        if: env.MUTATE != 'true' || matrix.classification == ''
        run: |
          echo "Mutation enabled: $MUTATE"
          echo "${{ matrix.upstream }} classification: ${{ matrix.classification || 'skipped' }}"

      - name: Require default branch for mutations
        if: env.MUTATE == 'true'
        run: test "$GITHUB_REF_NAME" = master

      - name: Close a resolved maintenance tracker
        if: env.MUTATE == 'true' && matrix.classification == 'no-change'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          UPSTREAM: ${{ matrix.upstream }}
        run: |
          marker="development-target:$UPSTREAM:maintenance-required"
          number=$(
            gh issue list --repo "$REPOSITORY" --state open --limit 100 \
              --label upstream-maintenance --json number,body \
              --jq ".[] | select(.body | contains(\"<!-- $marker -->\")) | .number" |
              head -1
          )
          if test -n "$number"; then
            gh issue close "$number" --repo "$REPOSITORY" --reason completed
          else
            echo "No open $UPSTREAM maintenance tracker needs closing."
          fi

      - name: Check out project for mutation
        if: >-
          env.MUTATE == 'true' && matrix.classification != '' &&
          matrix.classification != 'no-change'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download candidate record
        if: >-
          env.MUTATE == 'true' && matrix.classification != '' &&
          matrix.classification != 'no-change'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: development-candidate
          path: ${{ runner.temp }}/development-candidate

      - name: Download candidate evidence
        if: >-
          env.MUTATE == 'true' && matrix.classification != '' &&
          matrix.classification != 'no-change'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.upstream }}-candidate-evidence
          path: ${{ runner.temp }}/candidate-evidence

      - name: Select the frozen work item
        id: select
        if: >-
          env.MUTATE == 'true' && matrix.classification != '' &&
          matrix.classification != 'no-change'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          UPSTREAM: ${{ matrix.upstream }}
          CLASSIFICATION: ${{ matrix.classification }}
          REVISION: ${{ matrix.revision }}
        run: |
          gh issue list --repo "$REPOSITORY" --state open --limit 100 \
            --label upstream-maintenance --json number,body \
            > "$RUNNER_TEMP/open-maintenance-issues.json"
          gh pr list --repo "$REPOSITORY" --state open --limit 100 \
            --label upstream-maintenance \
            --json number,body,headRefName,url \
            > "$RUNNER_TEMP/open-maintenance-pulls.json"
          tools/select-development-target-work.sh \
            "$UPSTREAM" "$CLASSIFICATION" "$REVISION" \
            "$RUNNER_TEMP/open-maintenance-issues.json" \
            "$RUNNER_TEMP/open-maintenance-pulls.json" \
            > "$RUNNER_TEMP/work-selection.json"
          jq . "$RUNNER_TEMP/work-selection.json" >> "$GITHUB_STEP_SUMMARY"
          {
            echo "working_revision=$(jq -r .working_revision "$RUNNER_TEMP/work-selection.json")"
            echo "issue_number=$(jq -r '.issue_number // ""' "$RUNNER_TEMP/work-selection.json")"
            echo "pull_request_number=$(jq -r '.pull_request_number // ""' "$RUNNER_TEMP/work-selection.json")"
            echo "pull_request_url=$(jq -r '.pull_request_url // ""' "$RUNNER_TEMP/work-selection.json")"
            echo "pull_request_branch=$(jq -r '.pull_request_branch // ""' "$RUNNER_TEMP/work-selection.json")"
          } >> "$GITHUB_OUTPUT"

      - name: Synchronize the maintenance tracker
        id: tracker
        if: >-
          env.MUTATE == 'true' &&
          (matrix.classification == 'maintenance-required' ||
          matrix.classification == 'infrastructure-failure')
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          UPSTREAM: ${{ matrix.upstream }}
          CLASSIFICATION: ${{ matrix.classification }}
          WORKING_REVISION: ${{ steps.select.outputs.working_revision }}
          LATEST_REVISION: ${{ matrix.revision }}
          PULL_REQUEST_URL: ${{ steps.select.outputs.pull_request_url }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          tools/sync-development-target-issue.sh \
            "$UPSTREAM" "$CLASSIFICATION" "$WORKING_REVISION" "$LATEST_REVISION" \
            "$RUN_URL" "$RUNNER_TEMP/candidate-evidence/classification.json" \
            "$PULL_REQUEST_URL"

      - name: Prepare one frozen draft pull request
        id: prepare
        if: >-
          env.MUTATE == 'true' &&
          (matrix.classification == 'routine' || matrix.classification == 'maintenance-required') &&
          steps.select.outputs.pull_request_number == '' &&
          steps.select.outputs.working_revision == matrix.revision
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          UPSTREAM: ${{ matrix.upstream }}
          CLASSIFICATION: ${{ matrix.classification }}
          REVISION: ${{ matrix.revision }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          slug=$(printf '%s' "$REVISION" | tr -c '[:alnum:]-' '-')
          branch="automation/$UPSTREAM-${slug:0:32}"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git switch -c "$branch"
          tools/apply-development-target.sh \
            "$UPSTREAM" "$RUNNER_TEMP/development-candidate/candidate.json"
          git add --update
          if git diff --cached --name-only | grep -q '^.github/workflows/'; then
            echo "candidate update unexpectedly modifies workflow files" >&2
            exit 1
          fi
          git diff --cached --quiet && {
            echo "candidate update produced no tracked changes" >&2
            exit 1
          }
          git commit -m "chore: update $UPSTREAM development target to $REVISION"
          if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
            echo "refusing to overwrite existing branch $branch" >&2
            exit 1
          fi
          git push --set-upstream origin "$branch"

          gh label create upstream-maintenance --repo "$REPOSITORY" --color B60205 --force
          gh label create "$UPSTREAM" --repo "$REPOSITORY" --color 1D76DB --force
          labels="upstream-maintenance,$UPSTREAM"
          if test "$CLASSIFICATION" = maintenance-required; then
            gh label create agent-maintenance --repo "$REPOSITORY" --color FBCA04 --force
            labels="$labels,agent-maintenance"
            if jq -e 'any(.reasons[]?; test("ABI|version family|format|compile|behavior"; "i"))' \
                "$RUNNER_TEMP/candidate-evidence/classification.json" >/dev/null; then
              gh label create breaking-change --repo "$REPOSITORY" --color D93F0B --force
              labels="$labels,breaking-change"
            fi
          fi

          body="$RUNNER_TEMP/development-target-pr.md"
          {
            printf '<!-- development-target-pr:%s:%s:%s -->\n' \
              "$UPSTREAM" "$CLASSIFICATION" "$REVISION"
            printf '<!-- development-target-working:%s:%s -->\n\n' "$UPSTREAM" "$REVISION"
            printf 'Classification: **%s**\n\n' "$CLASSIFICATION"
            printf "Frozen candidate: \`%s\`\n\n" "$REVISION"
            printf 'Evidence: %s\n\n' "$RUN_URL"
            printf '%s\n' 'This draft deliberately stays on the recorded candidate when the upstream channel moves.'
            if test "$CLASSIFICATION" = maintenance-required; then
              printf '%s\n' 'Compatibility, ownership, layout, or behavior changes require review and must not auto-merge.'
            else
              printf '%s\n' 'This is a provenance-only routine update; required CI remains authoritative.'
            fi
          } > "$body"
          pr_url=$(gh pr create --repo "$REPOSITORY" --draft \
            --base master --head "$branch" --label "$labels" \
            --title "chore: update $UPSTREAM development target" --body-file "$body")
          pr_number=${pr_url##*/}
          {
            echo "pr_url=$pr_url"
            echo "pr_number=$pr_number"
            echo "branch=$branch"
          } >> "$GITHUB_OUTPUT"

          gh workflow run ci.yml --repo "$REPOSITORY" --ref "$branch"

      - name: Refresh the maintenance tracker with the draft pull request
        if: >-
          always() && env.MUTATE == 'true' &&
          (matrix.classification == 'maintenance-required' ||
          matrix.classification == 'infrastructure-failure') &&
          steps.tracker.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          UPSTREAM: ${{ matrix.upstream }}
          CLASSIFICATION: ${{ matrix.classification }}
          WORKING_REVISION: ${{ steps.select.outputs.working_revision }}
          LATEST_REVISION: ${{ matrix.revision }}
          PULL_REQUEST_URL: ${{ steps.prepare.outputs.pr_url || steps.select.outputs.pull_request_url }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          tools/sync-development-target-issue.sh \
            "$UPSTREAM" "$CLASSIFICATION" "$WORKING_REVISION" "$LATEST_REVISION" \
            "$RUN_URL" "$RUNNER_TEMP/candidate-evidence/classification.json" \
            "$PULL_REQUEST_URL"
