name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIG_VERSION: 0.16.0
  RUST_TOOLCHAIN: "1.88"
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
      sync: ${{ steps.classify.outputs.sync }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Select affected test groups
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          changed="$RUNNER_TEMP/changed-files.txt"
          case "$EVENT_NAME" in
            workflow_call|workflow_dispatch)
              printf '%s\n' __all__ > "$changed"
              ;;
            pull_request)
              git diff --name-only "$BASE_SHA" "$GITHUB_SHA" > "$changed"
              ;;
            push)
              if test -z "$BEFORE_SHA" ||
                  test "$BEFORE_SHA" = 0000000000000000000000000000000000000000 ||
                  ! git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
                printf '%s\n' __all__ > "$changed"
              else
                git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA" > "$changed"
              fi
              ;;
            *)
              printf '%s\n' __all__ > "$changed"
              ;;
          esac

          code=false
          sync=false
          while IFS= read -r path; do
            test -n "$path" || continue
            if test "$path" = __all__; then
              code=true
              sync=true
              break
            fi

            case "$path" in
              docs/*|.github/ISSUE_TEMPLATE/*|.github/PULL_REQUEST_TEMPLATE.md)
                ;;
              *.md)
                ;;
              *)
                code=true
                ;;
            esac

            case "$path" in
              build.zig|build.zig.zon|src/*|include/*|tests/*sync*|tools/check-sync-e2e.sh|.github/workflows/*)
                sync=true
                ;;
            esac
          done < "$changed"

          {
            echo "code=$code"
            echo "sync=$sync"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Change classification"
            echo
            echo "- Code/platform checks: \`$code\`"
            echo "- Sync checks: \`$sync\`"
            echo
            echo "<details><summary>Changed files</summary>"
            echo
            sed 's/^/- `/' "$changed" | sed 's/$/`/'
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

  quick:
    name: Quick checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
          use-cache: false

      - name: Verify formatting and shell scripts
        run: |
          zig fmt --check build.zig src tests examples bench tools/*.zig
          bash -n tools/*.sh tests/release-package*.sh
          shellcheck tools/*.sh tests/release-package*.sh

      - name: Run native-independent tests
        run: |
          zig build test-pure -Doptimize=Debug
          zig build test-ownership-invariants -Doptimize=ReleaseFast

      - name: Build public API documentation
        run: zig build docs

      - name: Check ABI manifests and pinned provenance
        run: |
          tools/check-abi-symbols.sh --header-only
          tools/check-abi-symbols.sh --sync --header-only
          test "$(zig version)" = "$ZIG_VERSION"
          header_sha=$(sed -n '/^#ifndef TURSO_H/,$p' include/turso.h | sha256sum | cut -d' ' -f1)
          test "$header_sha" = "14ee49b4f6c00e3f8c3c710b4df1c316ecc0802e1d8b19815d8caab09f2b70cb"
          sync_header_sha=$(sed -n '/^#ifndef TURSO_SYNC_H/,$p' include/turso_sync.h | sha256sum | cut -d' ' -f1)
          test "$sync_header_sha" = "38b9dc73fc2fe45c3d86d69ff2ad48b8c99d693a4462514ea50fb876aba6ee35"
          grep -F 'v0.7.1.tar.gz' build.zig.zon
          grep -F 'N-V-__8AABYTqgLLoRwhKj-QpEwCZuEqg0n62mHiVJuZRQcd' build.zig.zon
          grep -F '4a88feb7caef869c16f6215b6dc51eafd5b3e54e' src/version.zig
          grep -F '31cdceeb07d3b294e5b2f13b03cfdbbf59769b78' src/version.zig
          git diff --exit-code

  linux-x64:
    name: Tier 1 · Linux x64
    if: needs.changes.outputs.code == 'true'
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
          use-cache: false

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"

      - name: Run the canonical functional suite
        run: |
          zig build test \
            -Dtarget=x86_64-linux-gnu \
            -Dnative=source \
            -Dlinkage=static \
            -Doptimize=Debug \
            -j2 \
            --summary all
          zig build examples \
            -Dtarget=x86_64-linux-gnu \
            -Dnative=source \
            -Dlinkage=static \
            -Doptimize=Debug \
            -j2 \
            --summary all

      - name: Verify ABI and clean source/system consumers
        run: |
          static_lib=$(find .zig-cache/turso-cargo/turso_sdk_kit \
            -type f -name libturso_sdk_kit.a -not -path '*/deps/*' -print -quit)
          test -n "$static_lib"
          tools/check-abi-symbols.sh "$static_lib"
          tools/check-readme-example.sh "$static_lib"

          prefix="$RUNNER_TEMP/turso-prefix"
          mkdir -p "$prefix/lib"
          cp "$static_lib" "$prefix/lib/"
          (
            cd tests/consumer
            zig build run --cache-dir "$GITHUB_WORKSPACE/.zig-cache" \
              -Dtarget=x86_64-linux-gnu \
              -Dnative=source \
              -Dlinkage=static \
              -Doptimize=Debug \
              -j2
            zig build run --cache-dir "$GITHUB_WORKSPACE/.zig-cache" \
              -Dtarget=x86_64-linux-gnu \
              -Dnative=system \
              -Dnative-path="$prefix" \
              -Dlinkage=static \
              -Doptimize=Debug \
              -j2
          )

  macos-arm:
    name: Tier 1 · macOS ARM64
    if: needs.changes.outputs.code == 'true'
    needs: changes
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
          use-cache: false

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"

      - name: Run the native static suite
        run: |
          zig build test \
            -Dtarget=aarch64-macos \
            -Dnative=source \
            -Dlinkage=static \
            -Doptimize=ReleaseSafe \
            -j2 \
            --summary all

      - name: Verify ABI and clean source/system consumers
        run: |
          static_lib=$(find .zig-cache/turso-cargo/turso_sdk_kit \
            -type f -name libturso_sdk_kit.a -not -path '*/deps/*' -print -quit)
          test -n "$static_lib"
          tools/check-abi-symbols.sh "$static_lib"

          prefix="$RUNNER_TEMP/turso-prefix"
          mkdir -p "$prefix/lib"
          cp "$static_lib" "$prefix/lib/"
          (
            cd tests/consumer
            zig build run --cache-dir "$GITHUB_WORKSPACE/.zig-cache" \
              -Dtarget=aarch64-macos \
              -Dnative=source \
              -Dlinkage=static \
              -Doptimize=ReleaseSafe \
              -j2
            zig build run --cache-dir "$GITHUB_WORKSPACE/.zig-cache" \
              -Dtarget=aarch64-macos \
              -Dnative=system \
              -Dnative-path="$prefix" \
              -Dlinkage=static \
              -Doptimize=ReleaseSafe \
              -j2
          )

  windows-x64:
    name: Tier 1 · Windows x64 MSVC
    if: needs.changes.outputs.code == 'true'
    needs: changes
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
          use-cache: false

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"

      - name: Run the native static suite
        run: |
          zig build test \
            -Dtarget=x86_64-windows-msvc \
            -Dnative=source \
            -Dlinkage=static \
            -Doptimize=ReleaseSafe \
            -j2 \
            --summary all

      - name: Verify ABI and clean source/system consumers
        run: |
          export PATH="/c/Program Files/LLVM/bin:$PATH"
          static_lib=$(find .zig-cache/turso-cargo/turso_sdk_kit \
            -type f -iname turso_sdk_kit.lib ! -iname '*.dll.lib' \
            -not -path '*/deps/*' -print -quit)
          test -n "$static_lib"
          tools/check-abi-symbols.sh "$static_lib"

          prefix="$RUNNER_TEMP/turso-prefix"
          mkdir -p "$prefix/lib"
          cp "$static_lib" "$prefix/lib/"
          (
            cd tests/consumer
            zig build run --cache-dir "$GITHUB_WORKSPACE/.zig-cache" \
              -Dtarget=x86_64-windows-msvc \
              -Dnative=source \
              -Dlinkage=static \
              -Doptimize=ReleaseSafe \
              -j2
            zig build run --cache-dir "$GITHUB_WORKSPACE/.zig-cache" \
              -Dtarget=x86_64-windows-msvc \
              -Dnative=system \
              -Dnative-path="$prefix" \
              -Dlinkage=static \
              -Doptimize=ReleaseSafe \
              -j2
          )

  linux-arm:
    name: Tier 2 · Linux ARM64
    if: needs.changes.outputs.code == 'true'
    needs: changes
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
          use-cache: false

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"

      - name: Run the native static suite
        run: |
          zig build test \
            -Dtarget=aarch64-linux-gnu \
            -Dnative=source \
            -Dlinkage=static \
            -Doptimize=ReleaseSafe \
            -j2 \
            --summary all

      - name: Verify ABI and a clean consumer
        run: |
          static_lib=$(find .zig-cache/turso-cargo/turso_sdk_kit \
            -type f -name libturso_sdk_kit.a -not -path '*/deps/*' -print -quit)
          test -n "$static_lib"
          tools/check-abi-symbols.sh "$static_lib"
          (
            cd tests/consumer
            zig build run --cache-dir "$GITHUB_WORKSPACE/.zig-cache" \
              -Dtarget=aarch64-linux-gnu \
              -Dnative=source \
              -Dlinkage=static \
              -Doptimize=ReleaseSafe \
              -j2
          )

  sync:
    name: Sync · Linux x64
    if: needs.changes.outputs.sync == 'true'
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
          use-cache: false

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"

      - name: Run deterministic and native sync acceptance
        run: |
          zig build test-sync-workflows \
            -Dsync=true \
            -Doptimize=ReleaseSafe \
            --summary all
          zig build test-sync-abi \
            -Dtarget=x86_64-linux-gnu \
            -Dsync=true \
            -Dnative=source \
            -Dlinkage=static \
            -Doptimize=ReleaseSafe \
            -j2 \
            --summary all
          static_lib=$(find .zig-cache/turso-cargo/turso_sync_sdk_kit \
            -type f -name libturso_sync_sdk_kit.a -not -path '*/deps/*' -print -quit)
          test -n "$static_lib"
          tools/check-abi-symbols.sh --sync "$static_lib"

  supported-platforms:
    name: Supported platforms
    if: always()
    needs:
      - changes
      - quick
      - linux-x64
      - macos-arm
      - windows-x64
      - linux-arm
      - sync
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every applicable support gate
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          QUICK_RESULT: ${{ needs.quick.result }}
          LINUX_X64_RESULT: ${{ needs.linux-x64.result }}
          MACOS_ARM_RESULT: ${{ needs.macos-arm.result }}
          WINDOWS_X64_RESULT: ${{ needs.windows-x64.result }}
          LINUX_ARM_RESULT: ${{ needs.linux-arm.result }}
          SYNC_RESULT: ${{ needs.sync.result }}
        run: |
          test "$CHANGES_RESULT" = success
          test "$QUICK_RESULT" = success
          for result in \
            "$LINUX_X64_RESULT" \
            "$MACOS_ARM_RESULT" \
            "$WINDOWS_X64_RESULT" \
            "$LINUX_ARM_RESULT" \
            "$SYNC_RESULT"; do
            case "$result" in
              success|skipped) ;;
              *) echo "applicable support gate failed: $result" >&2; exit 1 ;;
            esac
          done
