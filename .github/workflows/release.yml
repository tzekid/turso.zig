name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  ZIG_VERSION: 0.16.0
  RUST_TOOLCHAIN: "1.88"
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: Validate supported platforms
    uses: ./.github/workflows/ci.yml

  source-packages:
    name: Source package · ${{ matrix.variant }}
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: base
            sync_arg: ""
            features: encryption,pure-rust-crypto
          - variant: sync
            sync_arg: "--sync"
            features: pure-rust-crypto
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
          use-cache: false

      - name: Install pinned Rust and packaging prerequisites
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          sudo apt-get update
          sudo apt-get install --yes jq

      - name: Fetch and verify the exact upstream tag
        run: |
          upstream="$RUNNER_TEMP/turso-upstream"
          git clone --filter=blob:none --no-checkout \
            https://github.com/tursodatabase/turso.git "$upstream"
          git -C "$upstream" checkout --detach \
            4a88feb7caef869c16f6215b6dc51eafd5b3e54e
          test "$(git -C "$upstream" rev-parse 'v0.7.1^{tag}')" = \
            31cdceeb07d3b294e5b2f13b03cfdbbf59769b78
          test "$(git -C "$upstream" rev-parse 'v0.7.1^{commit}')" = \
            4a88feb7caef869c16f6215b6dc51eafd5b3e54e
          echo "UPSTREAM_ROOT=$upstream" >> "$GITHUB_ENV"

      - name: Assemble twice and smoke the extracted source package
        env:
          SYNC_ARG: ${{ matrix.sync_arg }}
          FEATURES: ${{ matrix.features }}
        run: |
          common=(
            --source-root "$GITHUB_WORKSPACE"
            --upstream-root "$UPSTREAM_ROOT"
            --features "$FEATURES"
            --optimize ReleaseSafe
            --ci-run-url \
              "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          )
          if test -n "$SYNC_ARG"; then
            common+=("$SYNC_ARG")
          fi

          for attempt in 1 2; do
            tools/package-release.sh source \
              "${common[@]}" \
              --stage-root "$RUNNER_TEMP/stage-$attempt" \
              --output-dir "$RUNNER_TEMP/out-$attempt"
          done

          archive_one=$(find "$RUNNER_TEMP/out-1" -maxdepth 1 \
            -type f -name '*.tar.gz' -print -quit)
          archive_two=$(find "$RUNNER_TEMP/out-2" -maxdepth 1 \
            -type f -name '*.tar.gz' -print -quit)
          test -n "$archive_one"
          test -n "$archive_two"
          cmp "$archive_one" "$archive_two"

          printf '%s\n' dirty > release-dirty-sentinel
          if tools/package-release.sh source \
              "${common[@]}" \
              --stage-root "$RUNNER_TEMP/stage-dirty" \
              --output-dir "$RUNNER_TEMP/out-dirty" \
              > "$RUNNER_TEMP/dirty-package.log" 2>&1; then
            echo "source packager accepted a dirty checkout" >&2
            exit 1
          fi
          rm release-dirty-sentinel

          cp "$archive_one.sha256" "$RUNNER_TEMP/bad.sha256"
          first_char=$(cut -c1 "$RUNNER_TEMP/bad.sha256")
          if test "$first_char" = 0; then replacement=1; else replacement=0; fi
          sed -i "s/^./$replacement/" "$RUNNER_TEMP/bad.sha256"
          if tools/smoke-release.sh \
              --archive "$archive_one" \
              --sidecar "$RUNNER_TEMP/bad.sha256" \
              --work-root "$RUNNER_TEMP/smoke-bad" \
              --skip-consumer \
              > "$RUNNER_TEMP/bad-checksum.log" 2>&1; then
            echo "release smoke accepted a corrupted checksum" >&2
            exit 1
          fi

          tools/smoke-release.sh \
            --archive "$archive_one" \
            --work-root "$RUNNER_TEMP/smoke"

          mkdir -p "$RUNNER_TEMP/upload"
          cp "$archive_one" "$archive_one.sha256" "$RUNNER_TEMP/upload/"

      - name: Upload verified source package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-${{ matrix.variant }}-release-package
          path: ${{ runner.temp }}/upload/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish verified tag
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - validate
      - source-packages
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out annotated tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify tag and package version
        run: |
          test "$(git cat-file -t "$GITHUB_REF_NAME")" = tag
          package_version=$(sed -n \
            's/^[[:space:]]*\.version = "\([^"]*\)",/\1/p' \
            build.zig.zon)
          test -n "$package_version"
          test "$GITHUB_REF_NAME" = "v$package_version"

      - name: Download verified packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "source-*-release-package"
          path: release-inputs

      - name: Collect and verify release assets
        run: |
          mkdir -p dist
          find release-inputs -type f \
            \( -name '*.tar.gz' -o -name '*.tar.gz.sha256' \) \
            -exec cp {} dist/ \;
          test "$(find dist -maxdepth 1 -type f -name '*.tar.gz' | wc -l)" -eq 2
          test "$(find dist -maxdepth 1 -type f -name '*.tar.gz.sha256' | wc -l)" -eq 2
          for checksum in dist/*.tar.gz.sha256; do
            (
              cd dist
              sha256sum --check "${checksum##*/}"
            )
          done

      - name: Create or refresh GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -d '' assets < <(find dist -maxdepth 1 -type f -print0 | sort -z)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --verify-tag \
              --title "turso.zig $GITHUB_REF_NAME" \
              --generate-notes
          fi
